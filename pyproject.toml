[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-market-radar"
version = "0.1.0"
description = "15 years of Hacker News 'Who is hiring?' posts, turned into a tech job-market radar."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "requests>=2.31",
    "scikit-learn>=1.3",
    "statsmodels>=0.14",
    "streamlit>=1.30",
    "plotly>=5.18",
    "tqdm>=4.66",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0", "torch>=2.1"]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
